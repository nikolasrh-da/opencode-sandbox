# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: .NET, Node, CodeGraph and RTK
description: Development tools and OpenCode integrations.

# requires:
#   - opencode >= 2.0.0

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.nuget.org
          - globalcdn.nuget.org
          - registry.npmjs.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - description: Install toolchain commands
          user: "0"
          command: [sh, /opt/dotnet-node-toolchain/setup-system.sh]
        - description: Install the RTK OpenCode plugin and disable RTK telemetry
          user: agent
          command: [sh, /opt/dotnet-node-toolchain/setup-agent.sh]
